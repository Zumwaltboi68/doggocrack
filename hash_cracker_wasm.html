        }

            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);

            margin-bottom: 8px;
            font-weight: 600;
            color: #4ecdc4;
            font-size: 1.1rem;
        }
        
        .input-group input, .input-group select, .input-group textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            color: #e0e0e0;
            font-size: 1rem;
            transition: all 0.3s ease;

            outline: none;
            border-color: #4ecdc4;
            box-shadow: 0 0 20px rgba(78, 205, 196, 0.3);
        }
        
        .btn {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            color: white;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-right: 15px;
            margin-bottom: 10px;
            position: relative;
            overflow: hidden;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(78, 205, 196, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);

            font-size: 2rem;
            font-weight: 700;
            color: #4ecdc4;
            margin-bottom: 5px;
        }

            color: #999;
            font-size: 0.9rem;
        }

            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin: 20px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            width: 0%;

        }

            background: rgba(78, 205, 196, 0.1);
            border: 1px solid #4ecdc4;

        }
        
        .error {
            background: rgba(255, 107, 107, 0.1);
            border-color: #ff6b6b;
        }
        
        .log {
            height: 200px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.3);

        }
        
        .log::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        
        .log::-webkit-scrollbar-thumb {
            background: #4ecdc4;
            border-radius: 4px;
        }
        
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2rem;
            }
        }
    </style>

                <head><title>Performance Statistics</title></head>
                <body style="font-family: monospace; background: #1a1a2e; color: #e0e0e0; padding: 20px;">
                    <h2>🚀 Ultra-Performance Statistics</h2>
                    <p><strong>Total Hashes:</strong> ${stats.totalHashes.toLocaleString()}</p>
                    <p><strong>Peak Hash Rate:</strong> ${stats.peakHashRate.toLocaleString()} H/s</p>
                    <p><strong>Average Hash Rate:</strong> ${Math.floor(stats.averageHashRate).toLocaleString()} H/s</p>
                    <p><strong>Worker Threads:</strong> ${stats.workerCount}</p>
                    <p><strong>Status:</strong> ${stats.isRunning ? '🟢 Running' : '🔴 Stopped'}</p>
                    <p><strong>Hardware:</strong> ${navigator.hardwareConcurrency || 'Unknown'} cores detected</p>
                    <p><strong>Memory:</strong> ${navigator.deviceMemory || 'Unknown'} GB</p>
                    <p><strong>Platform:</strong> ${navigator.platform}</p>
                </body>
                </html>
            `);
        }

        // Advanced features
        function enableTurboMode() {
            // Maximize performance settings
            document.getElementById('maxLength').value = Math.min(8, parseInt(document.getElementById('maxLength').value));
            document.getElementById('charset').value = 'numeric'; // Fastest charset
            document.getElementById('hashAlgorithm').value = 'md5'; // Fastest algorithm
            
            cracker.log('🚀 TURBO MODE ENABLED');
            cracker.log('⚡ Optimized for maximum speed');
            cracker.log('📊 Settings: MD5, Numeric charset, Max length 8');
        }

        function loadWordlist() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.txt';
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const wordlist = e.target.result.split('\n').filter(line => line.trim());
                        cracker.log(`📁 Loaded wordlist: ${wordlist.length} words`);
                        // Implement dictionary attack here
                        startDictionaryAttack(wordlist);
                    };
                    reader.readAsText(file);
                }
            };
            input.click();
        }

        function startDictionaryAttack(wordlist) {
            const targetHash = document.getElementById('targetHash').value.trim();
            const algorithm = document.getElementById('hashAlgorithm').value;
            
            if (!targetHash) {
                alert('Please enter a target hash first');
                return;
            }
            
            cracker.log('📚 Starting dictionary attack...');
            cracker.isRunning = true;
            cracker.startTime = Date.now();
            cracker.totalHashes = 0;
            
            let found = false;
            const batchSize = 1000;
            
            async function processBatch(startIndex) {
                if (!cracker.isRunning || found) return;
                
                const endIndex = Math.min(startIndex + batchSize, wordlist.length);
                
                for (let i = startIndex; i < endIndex && cracker.isRunning; i++) {
                    const word = wordlist[i].trim();
                    if (!word) continue;
                    
                    const hash = algorithm === 'md5' ? cracker.md5(word) : cracker.sha256(word);
                    cracker.totalHashes++;
                    
                    if (hash.toLowerCase() === targetHash.toLowerCase()) {
                        found = true;
                        cracker.stop();
                        const elapsed = (Date.now() - cracker.startTime) / 1000;
                        cracker.showResult(`🎉 DICTIONARY ATTACK SUCCESS!<br>
                            <strong>Password:</strong> ${word}<br>
                            <strong>Position:</strong> ${i + 1}/${wordlist.length}<br>
                            <strong>Time:</strong> ${elapsed.toFixed(2)}s`, false);
                        cracker.log(`🏆 Dictionary attack found: "${word}"`);
                        return;
                    }
                }
                
                // Update progress
                const progress = (endIndex / wordlist.length) * 100;
                cracker.updateProgress(endIndex, wordlist.length);
                
                if (endIndex < wordlist.length) {
                    setTimeout(() => processBatch(endIndex), 1);
                } else {
                    cracker.stop();
                    cracker.showResult('❌ Dictionary attack completed - password not found', true);
                    cracker.log('📚 Dictionary attack finished - no match found');
                }
            }
            
            processBatch(0);
        }

        // Event listeners
        document.getElementById('charset').addEventListener('change', function() {
            const customGroup = document.getElementById('customCharsetGroup');
            customGroup.style.display = this.value === 'custom' ? 'block' : 'none';
        });

        // Keyboard shortcuts for power users
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                e.preventDefault();
                if (!cracker.isRunning) {
                    startCracking();
                } else {
                    stopCracking();
                }
            } else if (e.key === 'F5') {
                e.preventDefault();
                generateTestHash();
            } else if (e.ctrlKey && e.key === 't') {
                e.preventDefault();
                enableTurboMode();
            }
        });

        // Initialize UI with performance optimizations
        document.addEventListener('DOMContentLoaded', function() {
            cracker.log('🚀 Ultra-Performance Hash Cracker Pro initialized');
            cracker.log(`💻 Detected ${cracker.workerCount} CPU cores for parallel processing`);
            cracker.log(`🧠 Estimated peak performance: ${(cracker.workerCount * 2500000).toLocaleString()} H/s`);
            cracker.log('⌨️ Shortcuts: Ctrl+Enter (start/stop), F5 (test hash), Ctrl+T (turbo mode)');
            
            // Add performance monitoring
            setInterval(() => {
                if (cracker.isRunning) {
                    const stats = cracker.getPerformanceStats();
                    const rate = stats.averageHashRate;
                    if (rate > 0) {
                        document.title = `Hash Cracker Pro - ${Math.floor(rate/1000)}K H/s`;
                    }
                } else {
                    document.title = 'Hash Cracker Pro - Ready';
                }
            }, 1000);
        });

        // Add CSS animations for enhanced visual effects
        const style = document.createElement('style');
        style.textContent = `
            @keyframes pulse {
                0% { transform: scale(1); }
                50% { transform: scale(1.05); }
                100% { transform: scale(1); }
            }
            
            .result {
                animation: fadeIn 0.5s ease-in;
            }
            
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: translateY(0); }
            }
            
            .stat-value {
                transition: all 0.3s ease;
            }
            
            .progress-fill {
                transition: width 0.2s ease, box-shadow 0.3s ease;
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
